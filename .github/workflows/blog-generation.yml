name: Generate Blog Post

on:
  schedule:
    # Runs daily at 9am UTC
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  generate-post:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          npm ci
      
      - name: Setup blog generator
        run: |
          # Remove submodule and clone fresh
          rm -rf .blog-generator
          git clone https://github.com/sandsltd/autoblogger_2.git .blog-generator
          
          # Copy config files
          cp blog-generator.config.js .blog-generator/
          cp topic-history.json .blog-generator/
          
          # Install dependencies
          cd .blog-generator
          npm install --production
      
      - name: Generate blog post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd .blog-generator
          npm run generate
      
      - name: Rebuild static pages
        run: |
          npm run build
      
      - name: Commit and push if changed
        run: |
          # Copy updated topic history back
          cp .blog-generator/topic-history.json .
          
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add .blog-generator/content/posts/ public/images/blog/ topic-history.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add new blog post: $(date +'%Y-%m-%d') [automated]
            
            Generated by SEO Blog Generator
            Business: Saunders Simmons Ltd
            Location: Yeovil, Somerset"
            git push
          fi