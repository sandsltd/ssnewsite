name: Generate Blog Post

on:
  schedule:
    # Run every 30 minutes during UK business hours (9am-6pm UTC/BST aware)
    # This gives us chances to post throughout the workday
    - cron: '*/30 9-17 * * 1-5'
  workflow_dispatch: # Allow manual triggering

jobs:
  generate-post:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Check if we should generate a post
        id: should_generate
        run: |
          # Check if this is a manual trigger
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger detected - bypassing all time checks"
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            # Get current UK time (handles BST/GMT automatically)
            CURRENT_HOUR=$(TZ=Europe/London date +%H)
            CURRENT_MIN=$(TZ=Europe/London date +%M)
            CURRENT_DAY=$(TZ=Europe/London date +%u)
            
            echo "Current UK time: ${CURRENT_HOUR}:${CURRENT_MIN}"
            echo "Current day: ${CURRENT_DAY} (1=Monday, 7=Sunday)"
            
            # Check if it's a weekday (1-5) and within business hours (9:00-17:30)
            if [ $CURRENT_DAY -ge 1 ] && [ $CURRENT_DAY -le 5 ]; then
              if [ $CURRENT_HOUR -ge 9 ] && [ $CURRENT_HOUR -le 17 ]; then
                if [ $CURRENT_HOUR -eq 17 ] && [ $CURRENT_MIN -gt 30 ]; then
                  echo "Outside business hours (after 17:30)"
                  echo "should_run=false" >> $GITHUB_OUTPUT
                else
                  # Check last post time to ensure 2-3 hour gap
                  if [ -f "last-post-time.txt" ]; then
                    LAST_POST=$(cat last-post-time.txt)
                    CURRENT_TIMESTAMP=$(date +%s)
                    TIME_DIFF=$((CURRENT_TIMESTAMP - LAST_POST))
                    MIN_GAP=7200  # 2 hours in seconds
                    MAX_GAP=10800 # 3 hours in seconds
                    
                    # Add random delay (0-30 minutes) to vary posting times
                    RANDOM_DELAY=$((RANDOM % 1800))
                    EFFECTIVE_DIFF=$((TIME_DIFF - RANDOM_DELAY))
                    
                    if [ $EFFECTIVE_DIFF -ge $MIN_GAP ]; then
                      echo "Enough time has passed, generating post"
                      echo "should_run=true" >> $GITHUB_OUTPUT
                    else
                      echo "Too soon since last post (${TIME_DIFF} seconds)"
                      echo "should_run=false" >> $GITHUB_OUTPUT
                    fi
                  else
                    # No previous post record, generate one
                    echo "No previous post record, generating first post"
                    echo "should_run=true" >> $GITHUB_OUTPUT
                  fi
                fi
              else
                echo "Outside business hours"
                echo "should_run=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "Weekend - no posts"
              echo "should_run=false" >> $GITHUB_OUTPUT
            fi
          fi
      
      - name: Setup Node.js
        if: steps.should_generate.outputs.should_run == 'true'
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Install dependencies
        if: steps.should_generate.outputs.should_run == 'true'
        run: |
          npm ci
      
      - name: Setup blog generator
        if: steps.should_generate.outputs.should_run == 'true'
        run: |
          # Remove submodule and clone fresh
          rm -rf .blog-generator
          git clone https://github.com/sandsltd/autoblogger_2.git .blog-generator
          
          # Copy config files
          cp blog-generator.config.js .blog-generator/
          cp topic-history.json .blog-generator/ || echo "{}" > .blog-generator/topic-history.json
          
          # Install dependencies
          cd .blog-generator
          npm install --production
      
      - name: Add random delay for natural posting
        if: steps.should_generate.outputs.should_run == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          # Add random delay between 0-15 minutes to make posting look natural
          DELAY=$((RANDOM % 900))
          echo "Waiting ${DELAY} seconds for natural timing..."
          sleep $DELAY
      
      - name: Generate blog post
        if: steps.should_generate.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd .blog-generator
          npm run generate
          
          # Record the time of this post
          date +%s > ../last-post-time.txt
      
      - name: Copy generated content
        if: steps.should_generate.outputs.should_run == 'true'
        run: |
          # Create directories if they don't exist
          mkdir -p .blog-generator/content/posts
          mkdir -p public/images/blog
          
          # List generated content for debugging
          echo "Generated blog posts:"
          ls -la .blog-generator/content/posts/ || echo "No posts found"
          echo "Generated images:"
          ls -la public/images/blog/ || echo "No images found"
          
      - name: Rebuild static pages and sitemap
        if: steps.should_generate.outputs.should_run == 'true'
        run: |
          npm run build
          # Generate updated sitemap
          npm run postbuild || echo "No postbuild script"
      
      - name: Commit and push if changed
        if: steps.should_generate.outputs.should_run == 'true'
        run: |
          # Copy updated topic history and last post time back
          cp .blog-generator/topic-history.json .
          
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Debug: Show what files we're trying to add
          echo "Files to add:"
          ls -la .blog-generator/content/posts/
          
          # CRITICAL: Force add the blog-generator directory including all contents
          # The -f flag overrides .gitignore, and we need to be explicit
          git add -f .blog-generator/content/posts/*.md
          git add -f .blog-generator/content/
          git add -f public/images/blog/
          git add topic-history.json last-post-time.txt
          
          # Show what was staged
          echo "Staged files:"
          git status --short
          
          # Also show full status for debugging
          echo "Full git status:"
          git status
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # Get current UK time for commit message
            UK_TIME=$(TZ=Europe/London date +'%Y-%m-%d %H:%M')
            git commit -m "Add new blog post: ${UK_TIME} [automated]
            
            Generated by SEO Blog Generator
            Business: Saunders Simmons Ltd
            Location: Yeovil, Somerset
            Natural posting schedule: Mon-Fri 9am-5:30pm"
            git push
          fi