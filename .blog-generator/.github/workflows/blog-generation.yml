name: Generate Blog Post

on:
  schedule:
    # Runs every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  generate-post:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install blog generator
        run: |
          # Clone the generator (or install from npm when published)
          git clone https://github.com/sandsltd/autoblogger_2.git .blog-generator
          cd .blog-generator
          npm ci --production
      
      - name: Copy configuration
        run: |
          cp blog-generator.config.js .blog-generator/
          cp .env .blog-generator/ 2>/dev/null || true
      
      - name: Generate blog post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd .blog-generator
          npm run generate
      
      - name: Copy generated content
        run: |
          # Copy new blog posts
          cp -r .blog-generator/content/posts/* content/posts/
          
          # Copy new images
          mkdir -p public/images/blog
          if ls .blog-generator/public/images/blog/* 1> /dev/null 2>&1; then
            cp -r .blog-generator/public/images/blog/* public/images/blog/
          fi
          
          # Update topic history
          cp .blog-generator/topic-history.json ./
      
      - name: Rebuild static pages
        run: |
          npm ci
          npm run build
      
      - name: Commit and push if changed
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add content/posts/ public/images/blog/ topic-history.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add new blog post: $(date +'%Y-%m-%d') [automated]
            
            Generated by SEO Blog Generator
            Business: Saunders Simmons Ltd
            Location: Yeovil, Somerset"
            git push
          fi
